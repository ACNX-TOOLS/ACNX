name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: audit scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit
        shell: pwsh
        run: ./tools/audit-release.ps1 -Path ./src

      - name: Fail if scripts changed line endings
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem ./src -Include *.bat, *.cmd -Recurse | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            $text  = [Text.Encoding]::GetEncoding(28591).GetString($bytes)
            $bare  = ([regex]::Matches($text, "(?<!\r)\n")).Count
            Write-Host ("{0}: {1} bare LF" -f $_.Name, $bare)
            if ($bare -gt 0) { $bad++ }
          }
          if ($bad -gt 0) { throw "$bad file(s) lost CRLF" }

  release:
    name: publish release
    needs: audit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        shell: pwsh
        run: |
          $v = (Get-Content ./VERSION -Raw).Trim()
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -ne $tag) {
            throw "VERSION ($v) does not match tag ($tag)"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./tools/build-release.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Checksums
        id: sums
        shell: pwsh
        run: |
          $s = Get-Content ./dist/SHA256SUMS.txt -Raw
          "body<<EOF" >> $env:GITHUB_OUTPUT
          $s >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: ACNX v${{ steps.v.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: ./dist/release-body.md
          files: |
            dist/ACNX-v${{ steps.v.outputs.version }}.zip
            dist/SHA256SUMS.txt
          append_body: true
          generate_release_notes: false
          draft: false
          prerelease: false
